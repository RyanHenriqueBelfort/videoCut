[project]
name = "videocut"
version = "0.1.0"
description = "Cortes automáticos com IA local (Whisper + Ollama), edição via Remotion/DaVinci Resolve e voz via VoiceStudio"
requires-python = ">=3.10,<3.13"
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1.0",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5.1",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# DLLs CUDA para o faster-whisper usar a GPU no Windows
gpu = ["nvidia-cublas-cu12>=12.4,<12.9", "nvidia-cudnn-cu12>=9,<10"]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[project.scripts]
videocut = "videocut.cli:main"
videocut-mcp = "videocut.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videocut"]
